name: Build macOS App

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Public-preview image with Xcode 27.2 (the project's .icon bundle
    # crashes Xcode 26.x actool); matches the maintainer's local toolchain.
    runs-on: xcode-27
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          xcodebuild -showsdks | grep macosx

      - name: Build AirSync (Self Compiled, unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project AirSync.xcodeproj \
            -scheme "AirSync Self Compiled" \
            -configuration "Self Compiled" \
            -destination "generic/platform=macOS" \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Ad-hoc sign and package
        run: |
          APP="$RUNNER_TEMP/dd/Build/Products/Self Compiled/AirSync.app"
          if [ ! -d "$APP" ]; then
            echo "::error::AirSync.app not found at $APP"
            find "$RUNNER_TEMP/dd/Build/Products" -maxdepth 2 -name "*.app"
            exit 1
          fi
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP"
          echo "Ad-hoc signature OK"
          ditto -c -k --keepParent "$APP" "AirSync-macOS.zip"
          ls -lh "AirSync-macOS.zip"

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: AirSync-macOS
          path: AirSync-macOS.zip
          if-no-files-found: error
          retention-days: 30
